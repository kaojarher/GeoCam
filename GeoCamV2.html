<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PWA 響應式衛星地圖相機</title>
    
    <!-- PWA Primary Color & Meta -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GeoCam">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/684/684908.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Inline Web App Manifest -->
    <link rel="manifest" id="manifest-placeholder">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
            background-color: #0f172a;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header Navbar -->
    <header class="bg-slate-800/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-700/60 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="bg-gradient-to-tr from-indigo-500 to-sky-500 text-white p-2 rounded-xl shadow-md">
                <i class="fa-solid fa-location-dot text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base md:text-lg leading-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">GeoCam Pro</h1>
                <p class="text-xs text-slate-400">PWA 衛星地圖 & 二維碼定位相機</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <!-- GPS Status Badge -->
            <div id="gps-status" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="gps-text">定位中...</span>
            </div>

            <!-- Install PWA Button -->
            <button id="pwa-install-btn" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg shadow-md transition-all flex items-center space-x-1">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">安裝 App</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-5 flex flex-col gap-4">

        <!-- Camera View Container -->
        <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 aspect-[3/4] sm:aspect-[4/3] flex items-center justify-center">
            
            <!-- Live Video Stream -->
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
            
            <!-- Hidden Canvas for Composite Output -->
            <canvas id="canvas" class="hidden"></canvas>

            <!-- Realtime Overlay Info Bar -->
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/50 to-transparent p-3.5 flex flex-col gap-1.5">
                <div class="bg-slate-900/80 backdrop-blur-md p-2.5 rounded-xl border border-white/10 text-xs flex justify-between items-center text-slate-200">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <i class="fa-solid fa-crosshairs text-sky-400 flex-shrink-0"></i>
                        <div class="truncate">
                            <span class="text-slate-400">Lat:</span> <span id="lat-display" class="font-mono">--.------</span> |
                            <span class="text-slate-400">Lng:</span> <span id="lng-display" class="font-mono">--.------</span>
                        </div>
                    </div>
                    <span id="accuracy-display" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 border border-slate-700 flex-shrink-0 ml-1">精確度: --m</span>
                </div>
            </div>

            <!-- Camera Loading Screen -->
            <div id="camera-loading" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center gap-3 z-10">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-500"></i>
                <p class="text-sm text-slate-400">正在開啟鏡頭...</p>
            </div>
        </div>

        <!-- Toolbar Buttons -->
        <div class="bg-slate-800/60 backdrop-blur-md p-3.5 rounded-2xl border border-slate-700/50 flex items-center justify-around shadow-xl">
            <!-- Switch Camera -->
            <button id="switch-cam-btn" class="p-3.5 bg-slate-700/80 hover:bg-slate-700 text-slate-200 rounded-full transition-transform active:scale-95 shadow-md flex items-center justify-center">
                <i class="fa-solid fa-rotate text-lg"></i>
            </button>

            <!-- Capture Button -->
            <button id="capture-btn" class="relative group p-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-sky-500 rounded-full shadow-lg shadow-indigo-500/30 transition-transform active:scale-95">
                <div class="w-16 h-16 sm:w-18 sm:h-18 bg-slate-900 rounded-full flex items-center justify-center border-4 border-white">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 bg-indigo-500 rounded-full group-hover:bg-indigo-400 transition-colors flex items-center justify-center">
                        <i class="fa-solid fa-camera text-white text-xl"></i>
                    </div>
                </div>
            </button>

            <!-- Refresh Location -->
            <button id="refresh-gps-btn" class="p-3.5 bg-slate-700/80 hover:bg-slate-700 text-slate-200 rounded-full transition-transform active:scale-95 shadow-md flex items-center justify-center">
                <i class="fa-solid fa-location-crosshairs text-lg"></i>
            </button>
        </div>

        <!-- Result Preview Section -->
        <div id="result-container" class="hidden flex flex-col gap-4 bg-slate-800/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl border border-slate-700/80 shadow-2xl mt-1">
            <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                <h2 class="font-bold text-base sm:text-lg text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-image text-indigo-400"></i> 照片與地圖二維碼合成結果
                </h2>
            </div>

            <!-- Composite Output Image Preview -->
            <div class="relative bg-slate-950 rounded-xl overflow-hidden border border-slate-700 shadow-inner">
                <img id="result-img" class="w-full h-auto block max-h-[70vh] object-contain mx-auto" alt="合成照片" />
            </div>

            <!-- External Navigation Links -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                <a id="osm-link" href="#" target="_blank" class="flex items-center justify-between p-3 bg-slate-900/90 hover:bg-slate-900 border border-slate-700 rounded-xl text-slate-300 hover:text-white transition-colors">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-map text-emerald-400 text-base"></i>
                        <span>開啟 OpenStreetMap 地圖</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-slate-500"></i>
                </a>
                
                <a id="gmap-link" href="#" target="_blank" class="flex items-center justify-between p-3 bg-slate-900/90 hover:bg-slate-900 border border-slate-700 rounded-xl text-slate-300 hover:text-white transition-colors">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-satellite text-sky-400 text-base"></i>
                        <span>開啟 Google Maps 衛星定位</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-slate-500"></i>
                </a>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 pt-1">
                <a id="download-btn" download="geocam_photo.png" class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-download"></i> 下載相片
                </a>
                <button id="close-result-btn" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl transition-colors text-sm font-medium">
                    關閉
                </button>
            </div>
        </div>
    </main>

    <!-- Hidden Temporary Container for QR Code rendering -->
    <div id="qrcode-hidden-container" class="fixed -top-[9999px] -left-[9999px] opacity-0 pointer-events-none"></div>

    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800/80 mt-4">
        <p>© PWA GeoCam Pro - 支援完全響應式立式與橫式照片合成</p>
    </footer>

    <script>
        // PWA Manifest Dynamic Injector
        const manifestData = {
            "name": "PWA 相機與地圖定位工具",
            "short_name": "GeoCam",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/684/684908.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

        // Global State & Elements
        let currentStream = null;
        let facingMode = 'environment';
        let currentLat = null;
        let currentLng = null;
        let currentAccuracy = null;
        let deferredPrompt = null;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const cameraLoading = document.getElementById('camera-loading');
        const latDisplay = document.getElementById('lat-display');
        const lngDisplay = document.getElementById('lng-display');
        const accuracyDisplay = document.getElementById('accuracy-display');
        const gpsStatus = document.getElementById('gps-status');
        const gpsText = document.getElementById('gps-text');
        const resultContainer = document.getElementById('result-container');
        const resultImg = document.getElementById('result-img');
        const downloadBtn = document.getElementById('download-btn');
        const osmLink = document.getElementById('osm-link');
        const gmapLink = document.getElementById('gmap-link');

        // Initialize Camera Stream
        async function initCamera() {
            cameraLoading.classList.remove('hidden');
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                await video.play();
                cameraLoading.classList.add('hidden');
            } catch (err) {
                console.error("無法調用相機鏡頭:", err);
                cameraLoading.innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl"></i>
                    <p class="text-sm text-slate-300 text-center px-4">無法取得相機權限<br><span class="text-xs text-slate-500">${err.message}</span></p>
                `;
            }
        }

        // Initialize Geolocation Tracking
        function initGeolocation() {
            if (!navigator.geolocation) {
                updateGPSUI(false, "不支援 GPS 定位");
                return;
            }

            const options = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };

            navigator.geolocation.watchPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    currentAccuracy = Math.round(pos.coords.accuracy);

                    latDisplay.textContent = currentLat.toFixed(6);
                    lngDisplay.textContent = currentLng.toFixed(6);
                    accuracyDisplay.textContent = `精確度: ${currentAccuracy}m`;

                    updateGPSUI(true, "GPS 已定位");
                },
                (err) => {
                    console.warn("GPS 取得失敗:", err);
                    updateGPSUI(false, "定位失敗");
                },
                options
            );
        }

        function updateGPSUI(isSuccess, text) {
            gpsText.textContent = text;
            if (isSuccess) {
                gpsStatus.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                gpsStatus.querySelector('span').className = "w-2 h-2 rounded-full bg-emerald-400";
            } else {
                gpsStatus.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20";
                gpsStatus.querySelector('span').className = "w-2 h-2 rounded-full bg-rose-400";
            }
        }

        // Fetch OpenStreetMap Static Tile
        function fetchOSMTile(lat, lng, zoom = 15) {
            return new Promise((resolve) => {
                if (!lat || !lng) return resolve(null);
                
                const n = Math.pow(2, zoom);
                const xtile = Math.floor((lng + 180) / 360 * n);
                const latRad = lat * Math.PI / 180;
                const ytile = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
                
                const tileUrl = `https://tile.openstreetmap.org/${zoom}/${xtile}/${ytile}.png`;

                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => resolve({ img });
                img.onerror = () => resolve(null);
                img.src = tileUrl;
            });
        }

        // Guarantee QR Code generation using robust DOM rendering + Canvas extraction
        function generateQRCodeImage(text, targetSize) {
            return new Promise((resolve) => {
                const container = document.getElementById('qrcode-hidden-container');
                container.innerHTML = ''; // Clean old nodes

                try {
                    // Create new QR Code instance
                    const qrcode = new QRCode(container, {
                        text: text,
                        width: targetSize,
                        height: targetSize,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });

                    // Wait a frame for rendering
                    setTimeout(() => {
                        const canvasElem = container.querySelector('canvas');
                        if (canvasElem) {
                            const img = new Image();
                            img.onload = () => resolve(img);
                            img.onerror = () => resolve(null);
                            img.src = canvasElem.toDataURL("image/png");
                        } else {
                            const imgElem = container.querySelector('img');
                            if (imgElem && imgElem.src) {
                                const img = new Image();
                                img.onload = () => resolve(img);
                                img.onerror = () => resolve(null);
                                img.src = imgElem.src;
                            } else {
                                resolve(null);
                            }
                        }
                    }, 120);
                } catch (e) {
                    console.error("QR Code 生成錯誤:", e);
                    resolve(null);
                }
            });
        }

        // High Quality Responsive Photo Composition
        async function capturePhoto() {
            if (!video.videoWidth || !video.videoHeight) return;

            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;

            // Responsive info panel height calculation (adaptable to both portrait and landscape photos)
            const minFooterHeight = Math.max(260, Math.round(videoWidth * 0.32));
            const footerHeight = minFooterHeight;

            canvas.width = videoWidth;
            canvas.height = videoHeight + footerHeight;

            const ctx = canvas.getContext('2d');

            // 1. Draw Original Video Frame
            ctx.drawImage(video, 0, 0, videoWidth, videoHeight);

            // 2. Draw Bottom Background Panel
            ctx.fillStyle = '#0f172a'; // Dark slate
            ctx.fillRect(0, videoHeight, videoWidth, footerHeight);

            // Top Cyan Accent Line
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, videoHeight, videoWidth, Math.max(4, Math.round(videoWidth * 0.006)));

            // Prepare Map Data & Links
            const lat = currentLat || 0;
            const lng = currentLng || 0;
            const osmUrl = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}`;
            const gmapSatUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}&basemap=satellite`;

            osmLink.href = osmUrl;
            gmapLink.href = gmapSatUrl;

            // 3. Layout Dimensions Calculation
            const padding = Math.max(12, Math.round(footerHeight * 0.05));
            const squareBoxSize = footerHeight - (padding * 2);

            // Left Box: OSM Map Preview
            const mapX = padding;
            const mapY = videoHeight + padding;

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(mapX, mapY, squareBoxSize, squareBoxSize);

            const tileData = await fetchOSMTile(lat, lng);
            if (tileData && tileData.img) {
                ctx.drawImage(tileData.img, mapX, mapY, squareBoxSize, squareBoxSize);
                
                // Draw Location Crosshair Target
                const centerX = mapX + squareBoxSize / 2;
                const centerY = mapY + squareBoxSize / 2;
                
                ctx.strokeStyle = '#ef4444'; // Red center pin
                ctx.lineWidth = Math.max(2, Math.round(squareBoxSize * 0.03));
                ctx.beginPath();
                ctx.arc(centerX, centerY, squareBoxSize * 0.1, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(centerX, centerY, squareBoxSize * 0.03, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#64748b';
                ctx.font = `bold ${Math.round(squareBoxSize * 0.11)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('OSM 地圖預覽', mapX + squareBoxSize / 2, mapY + squareBoxSize / 2);
            }

            // Right Box: Google Maps Satellite QR Code
            const qrX = videoWidth - padding - squareBoxSize;
            const qrY = mapY;

            const qrImage = await generateQRCodeImage(gmapSatUrl, squareBoxSize);
            if (qrImage) {
                // Background card for QR code
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(qrX, qrY, squareBoxSize, squareBoxSize);
                
                const qrPad = Math.max(4, Math.round(squareBoxSize * 0.05));
                ctx.drawImage(qrImage, qrX + qrPad, qrY + qrPad, squareBoxSize - (qrPad * 2), squareBoxSize - (qrPad * 2));
            } else {
                ctx.fillStyle = '#334155';
                ctx.fillRect(qrX, qrY, squareBoxSize, squareBoxSize);
                ctx.fillStyle = '#94a3b8';
                ctx.font = `${Math.round(squareBoxSize * 0.1)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('二維碼生成失敗', qrX + squareBoxSize / 2, qrY + squareBoxSize / 2);
            }

            // 4. Middle Area: Dynamic Scaled Satellite & Location Text
            const textX = mapX + squareBoxSize + padding;
            const textRightBoundary = qrX - padding;
            const availableTextWidth = textRightBoundary - textX;

            ctx.textAlign = 'left';
            
            // Dynamic Font Sizing based on available width
            const titleFontSize = Math.max(13, Math.round(availableTextWidth * 0.085));
            const bodyFontSize = Math.max(11, Math.round(availableTextWidth * 0.065));
            const smallFontSize = Math.max(9, Math.round(availableTextWidth * 0.052));

            let currentY = mapY + titleFontSize;

            // Section Title
            ctx.font = `bold ${titleFontSize}px sans-serif`;
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('GPS 衛星定位資料', textX, currentY);

            // Latitude
            currentY += bodyFontSize * 1.6;
            ctx.font = `bold ${bodyFontSize}px monospace`;
            ctx.fillStyle = '#f8fafc';
            ctx.fillText(`緯度: ${lat.toFixed(6)}°`, textX, currentY);

            // Longitude
            currentY += bodyFontSize * 1.4;
            ctx.fillText(`經度: ${lng.toFixed(6)}°`, textX, currentY);

            // Accuracy
            currentY += bodyFontSize * 1.4;
            ctx.font = `${smallFontSize}px sans-serif`;
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText(`精確度: ±${currentAccuracy || '--'} 米`, textX, currentY);

            // Timestamp
            currentY += smallFontSize * 1.5;
            ctx.fillStyle = '#94a3b8';
            const now = new Date();
            const timeStr = now.toLocaleString('zh-TW', { hour12: false });
            ctx.fillText(`時間: ${timeStr}`, textX, currentY);

            // Subtitle for QR Code (Below QR Box)
            ctx.fillStyle = '#94a3b8';
            ctx.font = `${Math.max(8, Math.round(squareBoxSize * 0.075))}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('掃描開啟 Google 衛星地圖', qrX + squareBoxSize / 2, qrY + squareBoxSize + Math.max(10, Math.round(padding * 0.7)));

            // 5. Output Final Composite Image
            const dataUrl = canvas.toDataURL('image/png');
            resultImg.src = dataUrl;
            downloadBtn.href = dataUrl;
            
            resultContainer.classList.remove('hidden');
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // Event Listeners
        document.getElementById('capture-btn').addEventListener('click', capturePhoto);

        document.getElementById('switch-cam-btn').addEventListener('click', () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        document.getElementById('refresh-gps-btn').addEventListener('click', () => {
            updateGPSUI(false, "重新定位中...");
            initGeolocation();
        });

        document.getElementById('close-result-btn').addEventListener('click', () => {
            resultContainer.classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // PWA Installation Hook
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const pwaInstallBtn = document.getElementById('pwa-install-btn');
            pwaInstallBtn.classList.remove('hidden');

            pwaInstallBtn.addEventListener('click', () => {
                pwaInstallBtn.classList.add('hidden');
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            });
        });

        // Inline Service Worker Registration for Offline Capabilities
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'geocam-v2';
                self.addEventListener('install', (e) => {
                    e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./'])));
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);

            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl)
                    .then((reg) => console.log('SW Registered:', reg.scope))
                    .catch((err) => console.log('SW Registration Failed:', err));
            });
        }

        // Initialize App on Window Load
        window.onload = () => {
            initCamera();
            initGeolocation();
        };
    </script>
</body>
</html>
